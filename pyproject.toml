[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ans-prospect-tool"
version = "0.1.0"
description = "AI-powered sales intelligence tool for Avizent Network Solutions"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
ans-tool = "backend.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
